name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint:all

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Performance budgets
        run: npm run lint:budgets

      - name: Verify dist output
        run: |
          test -f dist/index.html
          ls dist/assets/*.js | head -5

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (desktop)
        run: npx playwright test --project=desktop

      - name: E2E tests (mobile drop-cap regression)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/e2e/dropcap-overlap.spec.ts --project=mobile
