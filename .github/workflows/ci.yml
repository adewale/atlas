name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Pinned image: the visual-regression step compares against Linux
    # baselines rendered on this same image by that step.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint:all

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify generated data is current
        run: git diff --exit-code -- data/generated

      # tests/performance.test.ts runs once, in the Performance budgets step,
      # where a missing dist/ fails instead of skipping.
      - name: Unit tests
        run: npm run test -- --exclude tests/performance.test.ts

      - name: Performance budgets
        run: npm run lint:budgets

      - name: Verify dist output
        run: |
          test -f dist/index.html
          test -f dist/elements/Fe.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/social-card.png
          test -f dist/404.html
          ls dist/assets/*.js | head -5

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (desktop)
        run: npx playwright test --project=desktop

      - name: E2E tests (mobile drop-cap regression)
        run: npx playwright test tests/e2e/dropcap-overlap.spec.ts --project=mobile

      - name: Visual regression against committed Linux baselines
        run: |
          if compgen -G "tests/e2e/visual-regression.spec.ts-snapshots/*-linux.png" > /dev/null; then
            # A missing or changed baseline fails; nothing is written.
            RUN_VISUAL=1 npx playwright test tests/e2e/visual-regression.spec.ts --project=desktop --update-snapshots=none
          else
            # Bootstrap: render the baselines on this image for review. The
            # e2e-screenshots artifact below carries them; nothing is committed.
            RUN_VISUAL=1 npx playwright test tests/e2e/visual-regression.spec.ts --project=desktop --update-snapshots=all
            msg="No *-linux.png baselines are committed yet, so visual regression compared nothing. This run rendered them: review tests/e2e/visual-regression.spec.ts-snapshots/ in the e2e-screenshots artifact and commit the PNGs there."
            echo "::warning title=Visual baselines not bootstrapped::$msg"
            echo "### Visual regression skipped: $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The audit specs save page.screenshot() files for human review and
      # Playwright writes failure screenshots/traces to test-results/.
      - name: Upload E2E screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/screenshots/
            tests/e2e/visual-regression.spec.ts-snapshots/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
